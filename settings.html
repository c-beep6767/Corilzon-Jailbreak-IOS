<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#f2f2f7">

<title>Impostazioni</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f2f2f7;
    color: #000;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.app {
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
}

.header {
    padding: 18px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(242,242,247,.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid #d5d5da;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
}

.back {
    display: none;
    border: 0;
    background: none;
    color: #007aff;
    font-size: 17px;
    padding: 0;
    margin-bottom: 8px;
    cursor: pointer;
}

.content {
    padding: 20px 16px 50px;
}

.group {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
}

.item {
    min-height: 62px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e5ea;
    cursor: pointer;
    user-select: none;
}

.item:last-child {
    border-bottom: none;
}

.item:active {
    background: #e5e5ea;
}

.itemLeft {
    display: flex;
    align-items: center;
    gap: 14px;
}

.icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
}

.itemTitle {
    font-size: 17px;
}

.itemSubtitle {
    color: #8e8e93;
    font-size: 13px;
    margin-top: 3px;
}

.arrow {
    color: #8e8e93;
    font-size: 27px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 22px;
}

.card p {
    color: #666;
    line-height: 1.45;
}

.button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    background: #007aff;
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
}

.button:active {
    opacity: .7;
}

.status {
    padding: 14px;
    background: #f2f2f7;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 14px;
}

.progress {
    height: 8px;
    background: #e5e5ea;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progressBar {
    width: 0%;
    height: 100%;
    background: #007aff;
    transition: width .15s;
}

.percent {
    text-align: center;
    margin-top: 8px;
    color: #777;
}

.code {
    background: #050505;
    color: #00ff66;
    border-radius: 12px;
    padding: 15px;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    min-height: 150px;
    overflow: auto;
}

</style>

</head>

<body>

<div class="app">

<header class="header">

    <button
        class="back"
        id="backButton">
        ‹ Impostazioni
    </button>

    <h1 id="title">
        Impostazioni
    </h1>

</header>

<main
    class="content"
    id="content">
</main>

</div>

<script>

const content =
    document.getElementById("content");

const title =
    document.getElementById("title");

const backButton =
    document.getElementById("backButton");

let currentPage = "home";


function icon(text) {

    return `
        <div class="icon">
            ${text}
        </div>
    `;

}


function menuItem(
    name,
    subtitle,
    iconText,
    page
) {

    return `
        <div
            class="item"
            data-page="${page}">

            <div class="itemLeft">

                ${icon(iconText)}

                <div>

                    <div class="itemTitle">
                        ${name}
                    </div>

                    <div class="itemSubtitle">
                        ${subtitle}
                    </div>

                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </div>
    `;

}


/* HOME */

function renderHome() {

    currentPage = "home";

    title.textContent =
        "Impostazioni";

    backButton.style.display =
        "none";

    content.innerHTML = `

        <div class="group">

            ${menuItem(
                "Corilizon 🔓✨",
                "Sistema Corilizon",
                "CZ",
                "corilizon"
            )}

        </div>

    `;

    activateMenus();

}


/* CORILIZON */

function renderCorilizon() {

    currentPage =
        "corilizon";

    title.textContent =
        "Corilizon 🔓✨";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="group">

            ${menuItem(
                "USB",
                "USB Manager",
                "USB",
                "usb"
            )}

            ${menuItem(
                "Package Installer",
                "Gestione pacchetti",
                "PKG",
                "package"
            )}

            ${menuItem(
                "Installer",
                "Installazione",
                "INS",
                "installer"
            )}

            ${menuItem(
                "Dev Mode",
                "Modalità sviluppatore",
                "DEV",
                "dev"
            )}

            ${menuItem(
                "System Info",
                "Informazioni sistema",
                "INFO",
                "info"
            )}

            ${menuItem(
                "Update Modded System",
                "Aggiornamento sistema",
                "UP",
                "update"
            )}

        </div>

    `;

    activateMenus();

}


/* USB */

function renderUSB() {

    currentPage =
        "usb";

    title.textContent =
        "USB";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>USB Manager</h2>

            <p>
                Gestione USB di Corilizon.
            </p>

            <button
                class="button"
                id="detectUSB">
                Rileva dispositivo USB
            </button>

            <div
                class="status"
                id="usbStatus">
                Nessun dispositivo rilevato.
            </div>

        </div>

    `;

    document
        .getElementById("detectUSB")
        .addEventListener(
            "click",
            function() {

                document
                    .getElementById("usbStatus")
                    .textContent =
                    "Scansione completata. Nessun dispositivo USB rilevato.";

            }
        );

}


/* PACKAGE INSTALLER */

function renderPackage() {

    currentPage =
        "package";

    title.textContent =
        "Package Installer";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>
                Package Installer
            </h2>

            <p>
                Gestione dei pacchetti Corilzon.
            </p>

            <input
                type="file"
                id="packageFile"
                style="width:100%;">

            <button
                class="button"
                id="installPackage">
                Installa Package
            </button>

            <div
                class="status"
                id="packageStatus">
                Nessun package selezionato.
            </div>

        </div>

    `;

    document
        .getElementById("installPackage")
        .addEventListener(
            "click",
            function() {

                const file =
                    document
                        .getElementById(
                            "packageFile"
                        )
                        .files[0];

                const status =
                    document
                        .getElementById(
                            "packageStatus"
                        );

                if (!file) {

                    status.textContent =
                        "Seleziona prima un file.";

                    return;

                }

                status.textContent =
                    "Package " +
                    file.name +
                    " installato.";

            }
        );

}


/* INSTALLER */

function renderInstaller() {

    currentPage =
        "installer";

    title.textContent =
        "Installer";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>
                Corilzon Installer
            </h2>

            <p>
                Installer di sistema simulato.
            </p>

            <button
                class="button"
                id="startInstall">
                Avvia Installer
            </button>

            <div id="installArea"></div>

        </div>

    `;

    document
        .getElementById("startInstall")
        .addEventListener(
            "click",
            function() {

                let percent = 0;

                document
                    .getElementById(
                        "installArea"
                    )
                    .innerHTML = `

                    <div class="progress">
                        <div
                            class="progressBar"
                            id="installBar">
                        </div>
                    </div>

                    <div
                        class="percent"
                        id="installPercent">
                        0%
                    </div>

                `;

                const timer =
                    setInterval(
                        function() {

                            percent +=
                                Math.floor(
                                    Math.random() * 10
                                ) + 5;

                            if (percent >= 100) {

                                percent = 100;

                                clearInterval(timer);

                                document
                                    .getElementById(
                                        "installPercent"
                                    )
                                    .textContent =
                                    "Installazione completata.";

                            } else {

                                document
                                    .getElementById(
                                        "installPercent"
                                    )
                                    .textContent =
                                    percent + "%";

                            }

                            document
                                .getElementById(
                                    "installBar"
                                )
                                .style.width =
                                percent + "%";

                        },
                        250
                    );

            }
        );

}


/* DEV MODE */

function renderDev() {

    currentPage =
        "dev";

    title.textContent =
        "Dev Mode";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>
                Developer Mode
            </h2>

            <p>
                Strumenti per sviluppatori
                Corilzon.
            </p>

            <button
                class="button"
                id="diagnostics">
                Run Diagnostics
            </button>

            <div
                class="code"
                id="devLog">
[Corilzon Dev Mode]
Waiting for command...
            </div>

        </div>

    `;

    document
        .getElementById("diagnostics")
        .addEventListener(
            "click",
            function() {

                document
                    .getElementById(
                        "devLog"
                    )
                    .textContent =
`[Corilzon Dev Mode]
Starting diagnostics...

[OK] System
[OK] File System
[OK] USB
[OK] Package Manager
[OK] Installer
[OK] Boot System

Diagnostics completed successfully.`;

            }
        );

}


/* SYSTEM INFO */

function renderInfo() {

    currentPage =
        "info";

    title.textContent =
        "System Info";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>
                System Information
            </h2>

            <div class="status">
                Corilzon Version: 1.0
            </div>

            <div class="status">
                System Status: Active
            </div>

            <div class="status">
                Architecture: ARM64
            </div>

            <div class="status">
                File System: CorilzonFS
            </div>

            <div class="status">
                Boot Manager: Corilzon Boot
            </div>

            <div class="status">
                Environment: Web
            </div>

        </div>

    `;

}


/* UPDATE MODDED SYSTEM */

function renderUpdate() {

    currentPage =
        "update";

    title.textContent =
        "Update Modded System";

    backButton.style.display =
        "block";

    content.innerHTML = `

        <div class="card">

            <h2>
                Update Modded System
            </h2>

            <p>
                Controlla l'aggiornamento
                del sistema Corilzon.
            </p>

            <button
                class="button"
                id="checkUpdate">
                Check for Update
            </button>

            <div id="updateArea"></div>

        </div>

    `;

    document
        .getElementById("checkUpdate")
        .addEventListener(
            "click",
            function() {

                let percent = 0;

                document
                    .getElementById(
                        "updateArea"
                    )
                    .innerHTML = `

                    <div class="status">
                        Checking system update...
                    </div>

                    <div class="progress">

                        <div
                            class="progressBar"
                            id="updateBar">
                        </div>

                    </div>

                    <div
                        class="percent"
                        id="updatePercent">
                        0%
                    </div>

                `;

                const timer =
                    setInterval(
                        function() {

                            percent +=
                                Math.floor(
                                    Math.random() * 12
                                ) + 4;

                            if (percent >= 100) {

                                percent = 100;

                                clearInterval(timer);

                                document
                                    .getElementById(
                                        "updatePercent"
                                    )
                                    .textContent =
                                    "System is up to date.";

                            } else {

                                document
                                    .getElementById(
                                        "updatePercent"
                                    )
                                    .textContent =
                                    percent + "%";

                            }

                            document
                                .getElementById(
                                    "updateBar"
                                )
                                .style.width =
                                percent + "%";

                        },
                        200
                    );

            }
        );

}


/* NAVIGAZIONE */

function activateMenus() {

    document
        .querySelectorAll("[data-page]")
        .forEach(
            function(element) {

                element.addEventListener(
                    "click",
                    function() {

                        openPage(
                            element
                                .getAttribute(
                                    "data-page"
                                )
                        );

                    }
                );

            }
        );

}


function openPage(page) {

    switch(page) {

        case "corilizon":
            renderCorilizon();
            break;

        case "usb":
            renderUSB();
            break;

        case "package":
            renderPackage();
            break;

        case "installer":
            renderInstaller();
            break;

        case "dev":
            renderDev();
            break;

        case "info":
            renderInfo();
            break;

        case "update":
            renderUpdate();
            break;

        default:
            renderHome();

    }

}


/* BACK */

backButton.addEventListener(
    "click",
    function() {

        if (currentPage === "corilizon") {

            renderHome();

        } else {

            renderCorilizon();

        }

    }
);


/* START */

renderHome();

</script>

</body>
</html>
