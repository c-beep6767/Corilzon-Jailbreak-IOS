<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Corilizon Settings</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f2f2f7;

    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
}

.homeButton {
    width: 100%;
    border: 0;
    background: #34c759;
    color: white;
    padding: 14px;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
}

.secondaryButton {

    border: 0;
    background: #e5e5ea;
    color: #111;
    padding: 13px;

    margin-top: 10px;

input[type="file"] {

.status {

}

.success {

    font-weight: 600;
}

.progressBox {
    margin-top: 15px;
    display: none;
}

.progressBar {
    width: 100%;
    height: 8px;
    background: #e5e5ea;
    border-radius: 10px;
    overflow: hidden;

.progressFill {

.appCard {
    background: #f2f2f7;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
}

.appName {
    font-weight: 600;
    font-size: 16px;
}

.appFile {
    color: #6d6d72;
    font-size: 13px;
    margin-top: 4px;
}

.smallButton {

    border-radius: 9px;
    padding: 9px 13px;
    margin-right: 6px;
    margin-top: 10px;
    background: #007aff;
    color: white;
}

.removeButton {

}

    color: #6d6d72;
    text-align: center;
    padding: 18px;
}

    margin-top: 14px;
    padding: 13px;
    background: #f2f2f7;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.45;

</style>
</head>

<body>

<div id="app"></div>

<script>

const DB_NAME = "CorilizonDB";
const DB_VERSION = 1;
const STORE_APPS = "apps";

let db;


/* =========================================================
   DATABASE
   ========================================================= */

function openDatabase() {

    return new Promise((resolve, reject) => {

        const request =
            indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {

            const database = event.target.result;

            if (!database.objectStoreNames.contains(STORE_APPS)) {

                database.createObjectStore(
                    STORE_APPS,
                    { keyPath: "id" }
                );
            }
        };

        request.onsuccess = function(event) {

            db = event.target.result;

            resolve(db);
        };

        request.onerror = function() {

            reject(request.error);
        };
    });
}


function getAllApps() {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_APPS, "readonly");

        const store =
            transaction.objectStore(STORE_APPS);

        const request =
            store.getAll();

        request.onsuccess = () =>
            resolve(request.result);

        request.onerror = () =>
            reject(request.error);
    });
}


function getApp(id) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_APPS, "readonly");

        const store =
            transaction.objectStore(STORE_APPS);

        const request =
            store.get(id);

        request.onsuccess = () =>
            resolve(request.result);

        request.onerror = () =>
            reject(request.error);
    });
}


function saveApp(app) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_APPS, "readwrite");

        const store =
            transaction.objectStore(STORE_APPS);

        const request =
            store.put(app);

        request.onsuccess = () =>
            resolve();

        request.onerror = () =>
            reject(request.error);
    });
}


function deleteApp(id) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_APPS, "readwrite");

        const store =
            transaction.objectStore(STORE_APPS);

        const request =
            store.delete(id);

        request.onsuccess = () =>
            resolve();

        request.onerror = () =>
            reject(request.error);
    });
}


/* =========================================================
   HEADER
   ========================================================= */

function header(title) {

    return `
        <div class="header">

            <button
                class="back"
                onclick="renderCorilizon()">

                ‹ Indietro

            </button>

            <h1>${title}</h1>

        </div>
    `;
}


/* =========================================================
   MAIN SETTINGS
   ========================================================= */

function renderHome() {

    document.getElementById("app").innerHTML = `

        <div class="header">

            <h1>Impostazioni</h1>

        </div>

        <div class="content">

            <div class="section">

                <p class="section-title">
                    Sistema
                </p>

                <div class="menu">

                    <div
                        class="item"
                        onclick="renderCorilizon()">

                        <div class="icon">
                            C
                        </div>

                        <div class="item-title">
                            Corilizon 🔓✨
                        </div>

                        <div class="arrow">
                            ›
                        </div>

                    </div>

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   CORILIZON MENU
   ========================================================= */

function renderCorilizon() {

    document.getElementById("app").innerHTML = `

        ${header("Corilizon 🔓✨")}

        <div class="content">

            <div class="menu">

                <div class="item"
                     onclick="renderUSB()">

                    <div class="icon">U</div>

                    <div class="item-title">
                        USB
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>


                <div class="item"
                     onclick="renderPackage()">

                    <div class="icon">P</div>

                    <div class="item-title">
                        Package Installer
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>


                <div class="item"
                     onclick="renderInstaller()">

                    <div class="icon">I</div>

                    <div class="item-title">
                        Installer
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>


                <div class="item"
                     onclick="renderDev()">

                    <div class="icon">D</div>

                    <div class="item-title">
                        Dev Mode
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>


                <div class="item"
                     onclick="renderInfo()">

                    <div class="icon">S</div>

                    <div class="item-title">
                        System Info
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>


                <div class="item"
                     onclick="renderUpdate()">

                    <div class="icon">U</div>

                    <div class="item-title">
                        Update Modded System
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>

            </div>

    `;

/* =========================================================
   USB
   ========================================================= */

function renderUSB() {

    document.getElementById("app").innerHTML = `

        ${header("USB")}

        <div class="content">

            <div class="card">

                <h3>USB Manager</h3>

                <p>
                    Corilizon USB interface.
                </p>

                <p>
                    Stato: pronto
                </p>

                <button
                    class="mainButton"
                    onclick="
                        alert(
                            'USB rilevato — modalità simulazione'
                        )

            </div>

    `;
}


/* =========================================================
   PACKAGE INSTALLER
   ========================================================= */

async function renderPackage() {

    const apps = await getAllApps();

    let installedApps = "";

    if (apps.length === 0) {

        installedApps = `
            <div class="empty">
                Nessuna applicazione installata.
            </div>
        `;

    } else {

        for (const app of apps) {

            installedApps += `

                <div class="appCard">

                    <div class="appName">
                        ${escapeHTML(app.name)}
                    </div>

                    <div class="appFile">
                        ${escapeHTML(app.fileName)}
                    </div>

                    <button
                        class="smallButton"
                        onclick="
                            openInstalledApp('${app.id}')
                        ">

                        Apri

                    </button>

                    <button
                        class="smallButton"
                        onclick="
                            addToHome('${app.id}')
                        ">

                        Aggiungi alla Home

                    </button>

                    <button
                        class="smallButton removeButton"
                        onclick="
                            uninstallApp('${app.id}')
                        ">

                        Disinstalla

                    </button>

                </div>
            `;
        }
    }


    document.getElementById("app").innerHTML = `

        ${header("Package Installer")}

        <div class="content">

            <div class="card">

                <h3>
                    Install HTML Package
                </h3>

                <p>
                    Seleziona il file
                    <b>index.html</b>
                    dell'applicazione.
                </p>

                <input
                    type="file"
                    id="packageFile"
                    accept=".html,text/html">

                <button
                    class="mainButton"
                    onclick="installPackage()">

                    Install Package

                </button>


                <div
                    id="progressBox"
                    class="progressBox">

                    <div class="progressBar">

                        <div
                            id="progressFill"
                            class="progressFill">
                        </div>

                    </div>

                    <p id="progressText">
                        Preparazione...
                    </p>

                </div>


                <div
                    id="installStatus"
                    class="status">
                </div>

            </div>


            <div class="section">

                <p class="section-title">
                    Installed Apps
                </p>

                <div class="menu">

                    ${installedApps}

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   INSTALL PACKAGE
   ========================================================= */

async function installPackage() {

    const input =
        document.getElementById("packageFile");

    const status =
        document.getElementById("installStatus");

    const progressBox =
        document.getElementById("progressBox");

    const progressFill =
        document.getElementById("progressFill");

    const progressText =
        document.getElementById("progressText");


    if (!input.files || input.files.length === 0) {

        status.style.display = "block";

        status.innerHTML =
            "Seleziona prima un file index.html.";

        return;
    }


    const file = input.files[0];


    if (!file.name.toLowerCase().endsWith(".html")) {

        status.style.display = "block";

        status.innerHTML =
            "Errore: il package deve essere un file HTML.";

        return;
    }


    progressBox.style.display = "block";

    status.style.display = "none";


    let progress = 0;


    const timer = setInterval(async () => {

        progress += 5;

        progressFill.style.width =
            progress + "%";

        progressText.textContent =
            "Installazione package: " +
            progress +
            "%";


        if (progress >= 100) {

            clearInterval(timer);


            try {

                const html =
                    await file.text();


                const id =
                    "app_" +
                    Date.now();


                const name =
                    file.name
                        .replace(/\.html$/i, "")
                        .replace(/[_-]/g, " ");


                await saveApp({

                    id: id,

                    name:
                        name || "HTML App",

                    fileName:
                        file.name,

                    html:
                        html,

                    installedAt:
                        new Date().toISOString()

                });


                status.style.display =
                    "block";


                status.innerHTML = `

                    <span class="success">
                        Package Installed ✓
                    </span>

                    <br><br>

                    ${escapeHTML(file.name)}
                    è stata installata.

                    <button
                        class="homeButton"
                        onclick="
                            addInstalledAppToHome('${id}')
                        ">

                        Aggiungi alla Home

                    </button>

                    <div class="instructions">

                        Dopo aver premuto
                        <b>Aggiungi alla Home</b>,
                        l'app verrà aperta in Safari.
                        Da Safari usa
                        <b>Condividi → Aggiungi alla schermata Home</b>
                        per inserirla nella vera Home di iPhone.

                    </div>
                `;


            } catch (error) {

                status.style.display =
                    "block";

                status.innerHTML =
                    "Errore durante l'installazione: " +
                    escapeHTML(error.message);
            }
        }

    }, 80);
}


/* =========================================================
   OPEN INSTALLED APP
   ========================================================= */

async function openInstalledApp(id) {

    const app =
        await getApp(id);

    if (!app) {

        alert(
            "Applicazione non trovata."
        );

        return;
    }


    openHTMLApp(app);
}


function openHTMLApp(app) {

    const blob =
        new Blob(
            [app.html],
            { type: "text/html" }
        );


    const url =
        URL.createObjectURL(blob);


    window.location.href = url;
}


/* =========================================================
   ADD INSTALLED APP TO REAL IPHONE HOME
   ========================================================= */

async function addInstalledAppToHome(id) {

    const app =
        await getApp(id);

    if (!app) {

        alert(
            "Applicazione non trovata."
        );

        return;
    }


    /*
       iOS non permette a una pagina web
       di premere automaticamente
       "Aggiungi alla schermata Home".

       Apriamo quindi l'app installata
       in Safari. L'utente può usare:

       Condividi
       →
       Aggiungi alla schermata Home
    */

    openHTMLApp(app);
}


/* =========================================================
   ADD HOME BUTTON FROM INSTALLED LIST
   ========================================================= */

async function addToHome(id) {

    const app =
        await getApp(id);

    if (!app) return;


    const confirmed =
        confirm(
            "Aprire " +
            app.name +
            " in Safari per aggiungerla alla Home?"
        );


    if (!confirmed) return;


    openHTMLApp(app);
}


/* =========================================================
   UNINSTALL
   ========================================================= */

async function uninstallApp(id) {

    const app =
        await getApp(id);

    if (!app) return;


    const confirmed =
        confirm(
            "Disinstallare " +
            app.name +
            "?"
        );


    if (!confirmed) return;


    await deleteApp(id);

    renderPackage();
}


/* =========================================================
   INSTALLER
   ========================================================= */

function renderInstaller() {

    document.getElementById("app").innerHTML = `

        ${header("Installer")}

        <div class="content">

            <div class="card">

                <h3>
                    Corilizon Installer
                </h3>

                <p>
                    Preparazione ambiente...
                </p>

                <div class="progressBar">

                    <div
                        id="installerProgress"
                        class="progressFill">
                    </div>

                </div>

                <p id="installerText">
                    0%
                </p>

            </div>

        </div>
    `;


    let p = 0;


    const timer = setInterval(() => {

        p += 4;


        document.getElementById(
            "installerProgress"
        ).style.width =
            p + "%";


        document.getElementById(
            "installerText"
        ).textContent =
            p + "%";


        if (p >= 100) {

            clearInterval(timer);

            document.getElementById(
                "installerText"
            ).textContent =
                "Installer completato ✓";
        }

    }, 100);
}

/* =========================================================

function renderUpdate() {

/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   START
   ========================================================= */

openDatabase()
    .then(() => {
        renderHome();
    })
    .catch(error => {

        document.getElementById("app").innerHTML = `

            <div class="content">

                <div class="card">

                    <h3>
                        Corilizon Error
                    </h3>

                    <p>
                        Impossibile avviare il database
                        delle applicazioni.
                    </p>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>

            </div>
        `;
    });

</script>
