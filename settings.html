<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Corilizon Settings</title>
<link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f2f2f7;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "SF Pro Text", Arial, sans-serif;
}

button,
input {
    font: inherit;
}

.app {
    min-height: 100vh;
    padding-bottom: 35px;
}

/* ================= HEADER ================= */

.header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 50px 20px 13px;
    background: rgba(242,242,247,.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid #d1d1d6;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
}

.back {
    display: inline-block;
    color: #007aff;
    font-size: 17px;
    margin-bottom: 7px;
    cursor: pointer;
}

/* ================= CONTENT ================= */

.content {
    padding: 24px 16px;
}

.section {
    margin-bottom: 26px;
}

.section-title {
    color: #6e6e73;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 600;
    margin: 0 15px 8px;
}

.card {
    background: #fff;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.035);
}

.row {
    min-height: 55px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e5ea;
    cursor: pointer;
}

.row:last-child {
    border-bottom: 0;
}

.row:active {
    background: #e5e5ea;
}

.row-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.row-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: white;
    font-weight: 700;
    font-size: 14px;
}

.row-title {
    font-size: 17px;
}

.arrow {
    color: #8e8e93;
    font-size: 23px;
}

/* ================= BUTTONS ================= */

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    background: #007aff;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:active {
    opacity: .72;
}

button:disabled {
    opacity: .55;
    cursor: default;
}

button.secondary {
    background: #e5e5ea;
    color: #111;
}

button.danger {
    background: #ff3b30;
}

/* ================= INPUT ================= */

input[type="file"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    background: #fff;
}

input[type="url"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    background: #fff;
    margin-top: 10px;
}

/* ================= STATUS ================= */

.status {
    background: #fff;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.success {
    color: #34c759;
    font-weight: 600;
}

.warning {
    color: #ff9500;
    font-weight: 600;
}

.error {
    color: #ff3b30;
    font-weight: 600;
}

.description {
    color: #6e6e73;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 0 2px;
}

/* ================= PROGRESS ================= */

.progress {
    width: 100%;
    height: 10px;
    margin-top: 15px;
    background: #d1d1d6;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0;
    height: 100%;
    background: #007aff;
    transition: width .15s linear;
}

.center {
    text-align: center;
}

/* ================= PACKAGES ================= */

.app-item {
    padding: 16px;
    border-bottom: 1px solid #e5e5ea;
}

.app-item:last-child {
    border-bottom: 0;
}

.app-name {
    font-size: 17px;
    font-weight: 600;
    word-break: break-word;
}

.app-meta {
    color: #6e6e73;
    font-size: 13px;
    margin-top: 4px;
}

.app-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.app-buttons button {
    margin-top: 0;
    flex: 1;
}

/* ================= CONSOLE ================= */

.console {
    margin-top: 14px;
    padding: 15px;
    border-radius: 12px;
    background: #000;
    color: #00ff66;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>
</head>

/* =========================================================
   CORILIZON SETTINGS
   ========================================================= */

const DB_NAME = "CorilizonDB";
const DB_VERSION = 4;
const STORE_NAME = "apps";

let db = null;
let currentBlobURL = null;
let developerModeActive = false;

/* =========================================================
   DATABASE
   ========================================================= */

function openDB() {
    return new Promise((resolve, reject) => {

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {

            const database = event.target.result;

            if (!database.objectStoreNames.contains(STORE_NAME)) {

                database.createObjectStore(STORE_NAME, {
                    keyPath: "id",
                    autoIncrement: true
                });

            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            resolve();
        };

        request.onerror = function() {
            reject(request.error);
        };
    });
}

function addPackage(data) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        const request = store.add(data);

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);
    });
}

function getPackages() {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.getAll();

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);
    });
}

function getPackage(id) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.get(id);

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);
    });
}

function updatePackage(data) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.put(data);

        request.onsuccess =
            () => resolve();

        request.onerror =
            () => reject(request.error);
    });
}

function deletePackage(id) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.delete(id);

        request.onsuccess =
            () => resolve();

        request.onerror =
            () => reject(request.error);
    });
}

/* =========================================================

   ========================================================= */

/* =========================================================
   USB
   ========================================================= */

function renderUSB() {

    document.getElementById("app").innerHTML = `

        ${makeHeader("USB", "goCorilizon()")}

        <div class="content">

            <div class="section">

                <div class="section-title">
                    USB
                </div>

                <div class="card">

                    <div style="padding:16px;">

                        <div
                            class="status"
                            id="usbStatus">

                            <b>Nessun dispositivo USB rilevato.</b>

                            <br><br>

                            Premi il pulsante solo se vuoi
                            cercare un dispositivo USB
                            supportato dal browser.

                        </div>

                        <button onclick="scanUSB()">
                            Cerca dispositivo USB
                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;
}

async function scanUSB() {

    const status =
        document.getElementById("usbStatus");

    /*
       Il browser non può dichiarare una USB collegata
       senza una richiesta/autorizzazione dell'utente.
    */

    if (!("usb" in navigator)) {

        status.innerHTML = `
            <span class="warning">
                USB non disponibile in questo browser.
            </span>

            <br><br>

            Nessun dispositivo è stato rilevato.
        `;

        return;
    }

    try {

        const device =
            await navigator.usb.requestDevice({
                filters: []
            });

        status.innerHTML = `

            <span class="success">
                Dispositivo USB selezionato ✓
            </span>

            <br><br>

            Nome:
            ${escapeHTML(
                device.productName ||
                "Dispositivo USB"
            )}

            <br>

            Produttore:
            ${escapeHTML(
                device.manufacturerName ||
                "Sconosciuto"
            )}

        `;

    } catch (error) {

        status.innerHTML = `

            <b>Nessun dispositivo USB rilevato.</b>

            <br><br>

            Nessuna USB è stata selezionata.

        `;
    }
}

/* =========================================================
   PACKAGE INSTALLER
   ========================================================= */

function renderPackage() {

    document.getElementById("app").innerHTML = `

        ${makeHeader(
            "Package Installer",
            "goCorilizon()"
        )}

        <div class="content">

            <div class="section">

                <div class="section-title">
                    Importa Package
                </div>

                <div class="card">

                    <div style="padding:16px;">

                        <input
                            id="packageFile"
                            type="file"
                            accept=".index,.html,.ipa">

                        <div class="description">

                            <b>.index / .html</b>
                            → Web App che può essere aperta
                            e aggiunta alla Home tramite Safari.

                            <br><br>

                            <b>.ipa</b>
                            → Package importato nel menu
                            Corilizon e collegabile a una
                            versione Web.

                        </div>

                        <button
                            onclick="installSelectedPackage()">

                            Install Package

                        </button>

                        <div id="packageStatus"></div>

                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Pacchetti installati
                </div>

                <div
                    class="card"
                    id="installedPackages">

                    Caricamento...

                </div>

            </div>

        </div>
    `;

    loadPackages();
}

async function installSelectedPackage() {

    const input =
        document.getElementById("packageFile");

    const status =
        document.getElementById("packageStatus");

    if (!input.files.length) {

        status.innerHTML = `
            <div class="status warning">
                Seleziona prima un package.
            </div>
        `;

        return;
    }

    const file = input.files[0];
    const name = file.name;
    const lower = name.toLowerCase();

    /* ================= HTML / INDEX ================= */

    if (
        lower.endsWith(".index") ||
        lower.endsWith(".html")
    ) {

        const content =
            await file.text();

        await addPackage({

            name: name,
            filename: name,
            type: "web",
            size: file.size,
            content: content,
            webUrl: "",
            created: Date.now()

        });

        status.innerHTML = `

            <div class="status">

                <span class="success">
                    Package Installed ✓
                </span>

                <br><br>

                <b>${escapeHTML(name)}</b>

                <br><br>

                Web App salvata correttamente.

                <button
                    onclick="openLatestWebApp()">
                    Apri Web App
                </button>

                <button
                    class="secondary"
                    onclick="showHomeInstructions()">
                    Aggiungi alla Home
                </button>

            </div>

        `;

        loadPackages();
        return;
    }

    /* ================= IPA ================= */

    if (lower.endsWith(".ipa")) {

        await addPackage({

            name: name,
            filename: name,
            type: "ipa",
            size: file.size,
            webUrl: "",
            created: Date.now()

        });

        status.innerHTML = `

            <div class="status">

                <span class="success">
                    Package Imported ✓
                </span>

                <br><br>

                <b>${escapeHTML(name)}</b>

                <br><br>

                L'IPA è stata importata nel menu
                di Corilizon.

                <br><br>

                <span class="warning">
                    Installazione iOS nativa non eseguita.
                </span>

                <br><br>

                Puoi associare una versione Web
                al package.

            </div>

        `;

        loadPackages();
        return;
    }

    status.innerHTML = `
        <div class="status error">
            Formato non supportato.
        </div>
    `;
}

/* =========================================================
   PACKAGE LIST
   ========================================================= */

async function loadPackages() {

    const container =
        document.getElementById(
            "installedPackages"
        );

    if (!container) return;

    const packages =
        await getPackages();

    if (!packages.length) {

        container.innerHTML = `
            <div class="description">
                Nessun package installato.
            </div>
        `;

        return;
    }

    container.innerHTML =
        packages.map(pkg => {

            /* WEB APP */

            if (pkg.type === "web") {

                return `

                    <div class="app-item">

                        <div class="app-name">
                            ${escapeHTML(pkg.name)}
                        </div>

                        <div class="app-meta">
                            Web App ·
                            ${formatSize(pkg.size)}
                        </div>

                        <div class="app-buttons">

                            <button
                                onclick="openWebApp(${pkg.id})">

                                Apri

                            </button>

                            <button
                                class="secondary"
                                onclick="addToHome(${pkg.id})">

                                Aggiungi alla Home

                            </button>

                        </div>

                        <button
                            class="danger"
                            onclick="removePackage(${pkg.id})">

                            Disinstalla

                        </button>

                    </div>

                `;
            }

            /* IPA */

            return `

                <div class="app-item">

                    <div class="app-name">
                        ${escapeHTML(pkg.name)}
                    </div>

                    <div class="app-meta">
                        IPA Package ·
                        ${formatSize(pkg.size)}
                    </div>

                    <div class="app-buttons">

                        <button
                            onclick="configureIPA(${pkg.id})">

                            Versione Web

                        </button>

                        ${
                            pkg.webUrl
                            ?
                            `
                            <button
                                class="secondary"
                                onclick="openIPAWeb(${pkg.id})">

                                Apri Web

                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    <button
                        class="danger"
                        onclick="removePackage(${pkg.id})">

                        Rimuovi

                    </button>

                </div>

            `;

        }).join("");
}

/* =========================================================
   OPEN WEB APP
   ========================================================= */

async function openWebApp(id) {

    const pkg =
        await getPackage(id);

    if (!pkg || pkg.type !== "web") {
        return;
    }

    if (currentBlobURL) {
        URL.revokeObjectURL(currentBlobURL);
    }

    const blob =
        new Blob(
            [pkg.content],
            { type: "text/html" }
        );

    currentBlobURL =
        URL.createObjectURL(blob);

    window.location.href =
        currentBlobURL;
}

async function openLatestWebApp() {

    const packages =
        await getPackages();

    const apps =
        packages
            .filter(pkg => pkg.type === "web")
            .sort(
                (a,b) =>
                    b.created - a.created
            );

    if (!apps.length) {
        return;
    }

    openWebApp(apps[0].id);
}

/* =========================================================
   ADD TO HOME
   ========================================================= */

async function addToHome(id) {

    const pkg =
        await getPackage(id);

    if (!pkg || pkg.type !== "web") {
        return;
    }

    if (currentBlobURL) {
        URL.revokeObjectURL(currentBlobURL);
    }

    const blob =
        new Blob(
            [pkg.content],
            { type: "text/html" }
        );

    currentBlobURL =
        URL.createObjectURL(blob);

    window.location.href =
        currentBlobURL;

    setTimeout(
        showHomeInstructions,
        800
    );
}

function showHomeInstructions() {

    alert(
        "Per aggiungere questa Web App alla Home:\n\n" +
        "1. Tocca Condividi in Safari.\n" +
        "2. Tocca «Aggiungi alla schermata Home».\n" +
        "3. Tocca «Aggiungi»."
    );
}

/* =========================================================
   IPA -> WEB
   ========================================================= */

async function configureIPA(id) {

    const pkg =
        await getPackage(id);

    if (!pkg) {
        return;
    }

    const url =
        prompt(
            "Inserisci l'URL della versione Web:",
            pkg.webUrl || ""
        );

    if (url === null) {
        return;
    }

    if (
        url &&
        !url.startsWith("https://") &&
        !url.startsWith("http://")
    ) {

        alert("Inserisci un URL Web valido.");
        return;
    }

    pkg.webUrl = url;

    await updatePackage(pkg);

    loadPackages();
}

async function openIPAWeb(id) {

    const pkg =
        await getPackage(id);

    if (!pkg || !pkg.webUrl) {

        alert(
            "Nessuna versione Web configurata."
        );

        return;
    }

    window.location.href =
        pkg.webUrl;
}

/* =========================================================
   DELETE
   ========================================================= */

async function removePackage(id) {

    if (
        !confirm(
            "Rimuovere questo package da Corilizon?"
        )
    ) {
        return;
    }

    await deletePackage(id);

    loadPackages();
}

/* =========================================================
   INSTALLER
   ========================================================= */

function renderInstaller() {

    document.getElementById("app").innerHTML = `

        ${makeHeader(
            "Installer",
            "goCorilizon()"
        )}

        <div class="content">

            <div class="section">

                <div class="section-title">
                    Installer
                </div>

                <div class="card">

                    <div style="padding:16px;">

                        <div
                            class="status"
                            id="installerStatus">

                            Installer pronto.

                        </div>

                        <div class="progress">

                            <div
                                id="installProgress"
                                class="progress-bar">
                            </div>

                        </div>

                        <div
                            id="installPercent"
                            class="center"
                            style="margin-top:10px;">

                            0%

                        </div>

                        <button
                            onclick="startInstaller()">

                            Start Installer

                        </button>

                    </div>

                </div>

            </div>

        </div>
    `;
}

function startInstaller() {

    const button =
        event.currentTarget;

    const status =
        document.getElementById(
            "installerStatus"
        );

    const progress =
        document.getElementById(
            "installProgress"
        );

    const percent =
        document.getElementById(
            "installPercent"
        );

    button.disabled = true;

    let value = 0;

    status.innerHTML =
        "<b>Installing...</b>";

    const timer =
        setInterval(() => {

            value++;

            progress.style.width =
                value + "%";

            percent.textContent =
                value + "%";

            if (value >= 100) {

                clearInterval(timer);

                button.disabled = false;

                status.innerHTML = `
                    <span class="success">
                        Installation Complete ✓
                    </span>
                `;

                percent.textContent =
                    "100% — Complete ✓";
            }

        }, 35);
}

/* =========================================================
   DEV MODE
   ========================================================= */

function renderDev() {

    document.getElementById("app").innerHTML = `

        ${makeHeader(

function toggleDeveloperMode() {

    developerModeActive =
        !developerModeActive;

    const status =
        document.getElementById(
            "devStatus"
        );

    const button =
        document.getElementById(
            "devButton"
        );

    const consoleBox =
        document.getElementById(
            "devConsole"
        );

    if (developerModeActive) {

        status.innerHTML = `

            <b>Developer Mode</b>

            <br><br>

            <span class="success">
                Developer Mode Active ✓
            </span>

        `;

        button.textContent =
            "Stop Developer Mode";

        consoleBox.textContent = `
Corilizon Developer Console
---------------------------
System: READY
Package Manager: READY
Web Launcher: READY
USB Interface: READY
Developer Mode: ACTIVE

Developer environment started.
`;

    } else {

        status.innerHTML = `

            <b>Developer Mode</b>

            <br><br>

            Developer Mode is currently
            disabled.

        `;

        button.textContent =
            "Start Developer Mode";

        consoleBox.textContent = `
Corilizon Developer Console
---------------------------
System: READY
Package Manager: READY
Web Launcher: READY
USB Interface: READY
Developer Mode: OFF

Developer environment stopped.
`;
    }
}

function renderUpdate() {

    document.getElementById("app").innerHTML = `

        ${makeHeader(
            "Update Modded System",
            "goCorilizon()"
        )}

        <div class="content">

            <div class="section">

                <div class="section-title">
                    System Update
                </div>

                <div class="card">

                    <div style="padding:16px;">

                        <div
                            class="status"
                            id="updateStatus">

                            <b>Update Modded System</b>

                            <br><br>

                            System is ready for update.

                        </div>

                        <button
                            id="updateButton"
                            onclick="startModdedUpdate()">

                            Update Modded System

                        </button>

                        <div
                            class="progress"
                            id="updateProgressContainer"
                            style="display:none;">

                            <div
                                id="updateProgress"
                                class="progress-bar">
                            </div>

                        </div>

                        <div
                            id="updatePercent"
                            class="center"
                            style="margin-top:10px;">

                        </div>

                    </div>

                </div>

            </div>

        </div>
    `;
}

function startModdedUpdate() {

    const button =
        document.getElementById(
            "updateButton"
        );

    const status =
        document.getElementById(
            "updateStatus"
        );

    const progressContainer =
        document.getElementById(
            "updateProgressContainer"
        );

    const progress =
        document.getElementById(
            "updateProgress"
        );

    const percent =
        document.getElementById(
            "updatePercent"
        );

    button.disabled = true;

    progressContainer.style.display =
        "block";

    status.innerHTML = `
        <b>Updating Modded System...</b>

        <br><br>

        Preparing update...
    `;

    let value = 0;

    const timer =
        setInterval(() => {

            value++;

            progress.style.width =
                value + "%";

            percent.textContent =
                value + "%";

            if (value < 25) {

                status.innerHTML = `
                    <b>
                        Updating Modded System...
                    </b>

                    <br><br>

                    Checking system files...
                `;

            } else if (value < 50) {

                status.innerHTML = `
                    <b>
                        Updating Modded System...
                    </b>

                    <br><br>

                    Preparing components...
                `;

            } else if (value < 75) {

                status.innerHTML = `
                    <b>
                        Updating Modded System...
                    </b>

                    <br><br>

                    Installing components...
                `;

            } else if (value < 100) {

                status.innerHTML = `
                    <b>
                        Updating Modded System...
                    </b>

                    <br><br>

                    Finalizing update...
                `;

            }

            if (value >= 100) {

                clearInterval(timer);

                button.disabled = false;

                status.innerHTML = `
                    <span class="success">
                        Update Modded System Complete ✓
                    </span>

                    <br><br>

                    Corilizon is up to date.
                `;

                percent.textContent =
                    "100% — Complete ✓";
            }

        }, 35);
}

/* =========================================================

   ========================================================= */

function formatSize(bytes) {

    if (!bytes) {
        return "0 B";
    }

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (
            bytes / 1024
        ).toFixed(1) + " KB";
    }

    return (
        bytes / (1024 * 1024)
    ).toFixed(1) + " MB";
}

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
