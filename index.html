<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<link rel="manifest" href="manifest.json">

<title>Corilzon Jailbreak</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                Arial,
                sans-serif;

    min-height:100vh;
}

.container{
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.logo{
    width:90px;
    height:90px;

    border-radius:22px;

    background:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:44px;

    margin-bottom:25px;

    box-shadow:
        0 0 30px rgba(255,255,255,.08);
}

h1{
    margin:0 0 8px;

    font-size:30px;
}

.version{
    color:#888;

    margin-bottom:30px;
}

.device{
    width:100%;
    max-width:360px;

    background:#111;

    border:1px solid #222;

    border-radius:18px;

    padding:18px;

    margin-bottom:20px;
}

.row{
    display:flex;
    justify-content:space-between;

    padding:8px 0;

    color:#aaa;
}

.row strong{
    color:#fff;
}

button{
    width:100%;
    max-width:360px;

    border:0;

    padding:16px;

    border-radius:15px;

    background:#fff;
    color:#000;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
}

button:disabled{
    opacity:.4;
}

.terminal{
    width:100%;
    max-width:360px;

    height:170px;

    background:#050505;

    border:1px solid #222;

    border-radius:14px;

    margin-top:20px;

    padding:14px;

    overflow:hidden;

    font-family:monospace;

    font-size:12px;

    color:#55ff55;
}

.progressBox{
    width:100%;
    max-width:360px;

    margin-top:15px;

    display:none;
}

.progressBar{
    width:100%;
    height:8px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;

    background:#fff;

    transition:.15s;
}

.percent{
    text-align:center;

    margin-top:7px;

    color:#888;

    font-size:13px;
}

.success{
    display:none;

    width:100%;
    max-width:360px;

    text-align:center;

    margin-top:25px;
}

.successIcon{
    font-size:48px;

    margin-bottom:10px;
}

.success h2{
    margin:0 0 8px;
}

.success p{
    color:#888;

    line-height:1.5;
}

.install{
    margin-top:18px;
}

.note{
    margin-top:20px;

    color:#555;

    font-size:11px;

    text-align:center;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🔓
    </div>

    <h1>Corilzon</h1>

    <div class="version">
        Jailbreak Tool
    </div>


    <div class="device">

        <div class="row">
            <span>Device</span>
            <strong>iPhone 17</strong>
        </div>

        <div class="row">
            <span>iOS</span>
            <strong>27.0</strong>
        </div>

        <div class="row">
            <span>Corilzon</span>
            <strong>Ready</strong>
        </div>

    </div>


    <button
        id="jailbreakButton"
        onclick="startJailbreak()">

        Jailbreak Now

    </button>


    <div
        id="terminal"
        class="terminal">

        Corilzon Kernel Environment<br>
        Waiting for user...

    </div>


    <div
        id="progressBox"
        class="progressBox">

        <div class="progressBar">

            <div
                id="progress"
                class="progress">
            </div>

        </div>

        <div
            id="percent"
            class="percent">

            0%

        </div>

    </div>


    <div
        id="success"
        class="success">

        <div class="successIcon">
            ✨🔓
        </div>

        <h2>Jailbreak Success</h2>

        <p>
            Corilzon Environment è stato
            attivato nella simulazione.
        </p>


        <button
            class="install"
            onclick="openSettings()">

            Installa Corilzon Settings

        </button>

    </div>


    <div class="note">
        Corilzon Web Simulation
    </div>

</div>


<script>

const terminal =
    document.getElementById("terminal");

const progress =
    document.getElementById("progress");

const percent =
    document.getElementById("percent");

const progressBox =
    document.getElementById("progressBox");

const success =
    document.getElementById("success");

const jailbreakButton =
    document.getElementById("jailbreakButton");


const lines = [

    "Initializing Corilzon...",
    "Checking device...",
    "iPhone 17 detected.",
    "iOS 27.0 detected.",
    "Preparing environment...",
    "Loading kernel interface...",
    "Preparing filesystem...",
    "Mounting virtual environment...",
    "Installing Corilzon components...",
    "Registering Settings Web App...",
    "Creating application manifest...",
    "Finalizing installation...",
    "Environment ready."

];


function addLine(text){

    terminal.innerHTML +=
        "<br>" + text;

    terminal.scrollTop =
        terminal.scrollHeight;

}


function startJailbreak(){

    jailbreakButton.disabled = true;

    progressBox.style.display =
        "block";

    let p = 0;
    let line = 0;


    const timer = setInterval(()=>{

        p += Math.floor(
            Math.random() * 5
        ) + 1;

        if(p > 100){
            p = 100;
        }


        progress.style.width =
            p + "%";

        percent.textContent =
            p + "%";


        if(
            line < lines.length &&
            p >=
            (line + 1) *
            (100 / lines.length)
        ){

            addLine(
                lines[line]
            );

            line++;

        }


        if(p >= 100){

            clearInterval(timer);

            addLine(
                "JAILBREAK SUCCESS ✓"
            );

            setTimeout(()=>{

                success.style.display =
                    "block";

            },700);

        }

    },180);

}


/*
    Apre settings.html.

    La pagina settings.html contiene
    l'app Impostazioni della simulazione.
*/

function openSettings(){

    localStorage.setItem(
        "corilzon_settings_installed",
        "true"
    );

    window.location.href =
        "settings.html";

}

</script>

</body>
</html>
